name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff papermill

      - name: Lint (ruff)
        run: |
          ruff check app/ scripts/ tests/ || true   # advisory for now; tighten later
          ruff format --check app/ scripts/ tests/ || true

      - name: Run pytest
        run: pytest tests/ -v

      - name: Verify canonical audit truth
        # Recomputes every number from raw data and asserts they match audit_truth.json.
        # Any code change that drifts a number breaks this build.
        run: python scripts/canonical_audit.py --verify

      - name: Execute all notebooks end-to-end
        # Headless re-execution proves every notebook is reproducible top-to-bottom.
        run: |
          for nb in notebooks/0*.ipynb; do
            echo "===== $nb ====="
            papermill --no-progress-bar "$nb" "/tmp/$(basename $nb)" || exit 1
          done

      - name: Streamlit boot smoke-test
        # The dashboard must at least *start*. Catches import errors and missing files.
        run: |
          nohup streamlit run app/streamlit_app.py \
            --server.headless true \
            --server.port 8765 \
            > /tmp/streamlit.log 2>&1 &
          sleep 12
          curl -fsS -o /dev/null http://localhost:8765/ && echo "Streamlit booted OK"
          grep -iE "error|exception|traceback" /tmp/streamlit.log && exit 1 || echo "(clean log)"
